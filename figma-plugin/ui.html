<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{font:14px Arial;padding:20px;color:#23211f;background:#faf8f5}h1{font:28px Georgia;margin:0 0 18px}p{line-height:1.6;color:#77736e}select,button{width:100%;padding:13px;margin:8px 0;border:1px solid #ddd4cb;border-radius:5px}button{background:#681e30;color:#fff;cursor:pointer}button:disabled{opacity:.5}#status{font-size:12px;line-height:1.6}</style><h1>BIG BEN</h1><p>42 страницы, версии для компьютера и телефона. Настоящие редактируемые слои и отдельная дизайн-система.</p><label for="device">Какие экраны создать?</label><select id="device"><option value="all">Все 84 экрана</option><option value="desktop">42 экрана для компьютера</option><option value="mobile">42 экрана для телефона</option></select><button id="import">Создать экраны</button><div id="status">Без доступа к сети. Исходные данные товаров демонстрационные.</div><script>const button=document.querySelector('#import');button.onclick=()=>{button.disabled=true;parent.postMessage({pluginMessage:{type:'import',device:document.querySelector('#device').value}},'*')};onmessage=e=>{const m=e.data.pluginMessage;if(!m)return;document.querySelector('#status').textContent=m.type==='progress'?`Создаём экран ${m.value} из ${m.total}…`:m.type==='done'?`Готово: ${m.total} экранов. File → Save local copy сохранит .fig.`:'Ошибка: '+m.message;if(m.type!=='progress')button.disabled=false};</script></html>
