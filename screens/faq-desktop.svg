<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="1320" viewBox="0 0 1440 1320"><title>Вопросы и ответы</title><rect width="100%" height="100%" fill="#FAF8F5"/><rect x="0" y="0" width="1440" height="32" rx="0" fill="#681E30"/><text x="80" y="18.46" font-size="11" fill="#FFFFFF" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск</text><text x="585" y="18.46" font-size="11" fill="#FFFFFF" font-weight="400" font-family="Inter, Arial, sans-serif">ВРЕМЯ БЫТЬ СОБОЙ</text><text x="1166" y="18.46" font-size="11" fill="#FFFFFF" font-weight="400" font-family="Inter, Arial, sans-serif">Магазины и сервис</text><rect x="0" y="32" width="1440" height="92" rx="0" fill="#FFFFFF"/><text x="80" y="82.24" font-size="34" fill="#23211F" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="81" y="99.88" font-size="8" fill="#77736E" font-weight="500" font-family="Inter, Arial, sans-serif">ЧАСЫ · СТИЛЬ · ХАРАКТЕР</text><text x="380" y="85.03999999999999" font-size="14" fill="#23211F" font-weight="500" font-family="Inter, Arial, sans-serif">Каталог</text><text x="500" y="85.03999999999999" font-size="14" fill="#23211F" font-weight="500" font-family="Inter, Arial, sans-serif">Бренды</text><text x="620" y="85.03999999999999" font-size="14" fill="#23211F" font-weight="500" font-family="Inter, Arial, sans-serif">Новинки</text><text x="740" y="85.03999999999999" font-size="14" fill="#23211F" font-weight="500" font-family="Inter, Arial, sans-serif">Журнал</text><text x="860" y="85.03999999999999" font-size="14" fill="#23211F" font-weight="500" font-family="Inter, Arial, sans-serif">О нас</text><g transform="translate(1170 71)"><path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm6-2 6 6" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1218 71)"><path d="M12 21C7 17 2 13 2 8a5 5 0 0 1 10-2 5 5 0 0 1 10 2c0 5-5 9-10 13Z" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1266 71)"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10ZM3 23a9 9 0 0 1 18 0" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(1314 71)"><path d="M4 7h16l1 15H3L4 7Zm4 0V5a4 4 0 0 1 8 0v2" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="0" y="123" width="1440" height="1" rx="0" fill="#E5DFD7"/><text x="80" y="171.46" font-size="11" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Главная  /  Вопросы и ответы</text><text x="80" y="238.72" font-size="52" fill="#23211F" font-weight="400" font-family="Georgia, serif">Вопросы и ответы</text><text x="80" y="293.22" font-size="27" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как выбрать часы?</text><text x="530" y="284.62" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Используйте фильтры по стилю, размеру и механизму. Для личного подбора</text><text x="530" y="310.97" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">запишитесь на примерку.</text><rect x="80" y="370" width="1280" height="1" rx="0" fill="#E5DFD7"/><text x="80" y="429.22" font-size="27" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как проверить наличие?</text><text x="530" y="420.62" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Наличие подтверждается для выбранной модели и магазина перед оплатой.</text><rect x="80" y="506" width="1280" height="1" rx="0" fill="#E5DFD7"/><text x="80" y="565.22" font-size="27" fill="#23211F" font-weight="400" font-family="Georgia, serif">Можно ли заказать доставку?</text><text x="530" y="556.62" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Способы и сроки получения будут доступны после выбора города.</text><rect x="80" y="642" width="1280" height="1" rx="0" fill="#E5DFD7"/><text x="80" y="701.22" font-size="27" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как использовать бонусы?</text><text x="530" y="692.62" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Доступный баланс отображается в личном кабинете, а условия списания — при</text><text x="530" y="718.97" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">оформлении заказа.</text><rect x="80" y="778" width="1280" height="1" rx="0" fill="#E5DFD7"/><text x="80" y="837.22" font-size="27" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как обратиться в сервис?</text><text x="530" y="828.62" font-size="17" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Заполните заявку, указав модель часов и описание проблемы.</text><rect x="80" y="914" width="1280" height="1" rx="0" fill="#E5DFD7"/><rect x="80" y="950" width="270" height="48" rx="4" fill="#FFFFFF" stroke="#E5DFD7"/><text x="98" y="977.04" font-size="14" fill="#23211F" font-weight="600" font-family="Inter, Arial, sans-serif">Связаться с магазином</text><rect x="0" y="1070" width="1440" height="250" rx="0" fill="#242220"/><text x="80" y="1128.66" font-size="31" fill="#F7F2E9" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="80" y="1166.9" font-size="15" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Часы, которые становятся</text><text x="80" y="1191.9" font-size="15" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">частью вашей истории.</text><text x="450" y="1118.46" font-size="11" fill="#A69D92" font-weight="600" font-family="Inter, Arial, sans-serif">ПОКУПАТЕЛЯМ</text><text x="450" y="1160.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Доставка и оплата</text><text x="450" y="1189.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Возврат и гарантия</text><text x="450" y="1218.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Вопросы и ответы</text><text x="770" y="1118.46" font-size="11" fill="#A69D92" font-weight="600" font-family="Inter, Arial, sans-serif">BIG BEN</text><text x="770" y="1160.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">О компании</text><text x="770" y="1189.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Наши магазины</text><text x="770" y="1218.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Сервис и ремонт</text><text x="1080" y="1118.46" font-size="11" fill="#A69D92" font-weight="600" font-family="Inter, Arial, sans-serif">НА СВЯЗИ</text><text x="1080" y="1160.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск</text><text x="1080" y="1189.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Контакты магазина</text><text x="1080" y="1218.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Написать нам →</text><rect x="80" y="1251" width="1280" height="1" rx="0" fill="#45413D"/><text x="80" y="1287.46" font-size="11" fill="#A69D92" font-weight="400" font-family="Inter, Arial, sans-serif">© BIG BEN 2026</text><text x="960" y="1287.46" font-size="11" fill="#A69D92" font-weight="400" font-family="Inter, Arial, sans-serif">Конфиденциальность     Условия продажи</text></svg>