">уточнит детали и согласует диагностику.</text><text x="20" y="1473.1000000000001" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Стоимость работ подтверждается до начала</text><text x="20" y="1496.3500000000001" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">ремонта.</text><rect x="20" y="1541.7" width="350" height="1" rx="0" fill="#E5DFD7"/><rect x="0" y="1611.7" width="390" height="330" rx="0" fill="#242220"/><text x="20" y="1670.3600000000001" font-size="31" fill="#F7F2E9" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="20" y="1712.88" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Часы, которые становятся частью вас.</text><text x="20" y="1762.74" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Каталог     Бренды     Магазины</text><text x="20" y="1801.74" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Доставка     Оплата     Сервис</text><text x="20" y="1849.88" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск · Написать нам →</text><text x="20" y="1905.3" font-size="10" fill="#A69D92" font-weight="400" font-family="Inter, Arial, sans-serif">© BIG BEN   ·   Политика конфиденциальности</text></svg>