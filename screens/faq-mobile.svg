<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="1488" viewBox="0 0 390 1488"><title>Вопросы и ответы</title><rect width="100%" height="100%" fill="#FAF8F5"/><rect x="0" y="0" width="390" height="30" rx="0" fill="#681E30"/><text x="52" y="17.46" font-size="11" fill="#FFFFFF" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск · Часы с характером</text><rect x="0" y="30" width="390" height="66" rx="0" fill="#FFFFFF"/><g transform="translate(20 52)"><path d="M2 5h20M2 12h20M2 19h20" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="115" y="64.5" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">BIG BEN</text><g transform="translate(306 52)"><path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm6-2 6 6" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(346 52)"><path d="M4 7h16l1 15H3L4 7Zm4 0V5a4 4 0 0 1 8 0v2" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="0" y="95" width="390" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="129.46" font-size="11" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Главная  /  Вопросы и ответы</text><text x="20" y="179.52" font-size="32" fill="#23211F" font-weight="400" font-family="Georgia, serif">Вопросы и ответы</text><text x="20" y="225.5" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как выбрать часы?</text><text x="20" y="262.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Используйте фильтры по стилю, размеру и</text><text x="20" y="286.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">механизму. Для личного подбора запишитесь</text><text x="20" y="309.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">на примерку.</text><rect x="20" y="354.75" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="406.25" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как проверить наличие?</text><text x="20" y="443.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Наличие подтверждается для выбранной модели</text><text x="20" y="466.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">и магазина перед оплатой.</text><rect x="20" y="512.25" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="563.75" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Можно ли заказать доставку?</text><text x="20" y="601.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Способы и сроки получения будут доступны</text><text x="20" y="624.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">после выбора города.</text><rect x="20" y="669.75" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="721.25" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как использовать бонусы?</text><text x="20" y="758.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Доступный баланс отображается в личном</text><text x="20" y="781.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">кабинете, а условия списания — при</text><text x="20" y="805.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">оформлении заказа.</text><rect x="20" y="850.5" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="902.0" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Как обратиться в сервис?</text><text x="20" y="939.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Заполните заявку, указав модель часов и</text><text x="20" y="962.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">описание проблемы.</text><rect x="20" y="1008.0" width="350" height="1" rx="0" fill="#E5DFD7"/><rect x="20" y="1038.0" width="350" height="48" rx="4" fill="#FFFFFF" stroke="#E5DFD7"/><text x="38" y="1065.04" font-size="14" fill="#23211F" font-weight="600" font-family="Inter, Arial, sans-serif">Связаться с магазином</text><rect x="0" y="1158.0" width="390" height="330" rx="0" fill="#242220"/><text x="20" y="1216.66" font-size="31" fill="#F7F2E9" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="20" y="1259.18" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Часы, которые становятся частью вас.</text><text x="20" y="1309.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Каталог     Бренды     Магазины</text><text x="20" y="1348.04" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Доставка     Оплата     Сервис</text><text x="20" y="1396.18" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск · Написать нам →</text><text x="20" y="1451.6" font-size="10" fill="#A69D92" font-weight="400" font-family="Inter, Arial, sans-serif">© BIG BEN   ·   Политика конфиденциальности</text></svg>