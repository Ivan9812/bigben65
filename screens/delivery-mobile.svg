<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="390" height="1197" viewBox="0 0 390 1197"><title>Доставка</title><rect width="100%" height="100%" fill="#FAF8F5"/><rect x="0" y="0" width="390" height="30" rx="0" fill="#681E30"/><text x="52" y="17.46" font-size="11" fill="#FFFFFF" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск · Часы с характером</text><rect x="0" y="30" width="390" height="66" rx="0" fill="#FFFFFF"/><g transform="translate(20 52)"><path d="M2 5h20M2 12h20M2 19h20" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="115" y="64.5" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">BIG BEN</text><g transform="translate(306 52)"><path d="M10 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16Zm6-2 6 6" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(346 52)"><path d="M4 7h16l1 15H3L4 7Zm4 0V5a4 4 0 0 1 8 0v2" fill="none" stroke="#23211F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g><rect x="0" y="95" width="390" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="129.46" font-size="11" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Главная  /  Доставка</text><text x="20" y="179.52" font-size="32" fill="#23211F" font-weight="400" font-family="Georgia, serif">Доставка</text><text x="20" y="225.5" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Получение в магазине</text><text x="20" y="262.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Выберите удобный магазин при оформлении</text><text x="20" y="286.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">заказа. Подтверждение готовности к выдаче</text><text x="20" y="309.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">появится в личном кабинете.</text><rect x="20" y="354.75" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="406.25" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Доставка</text><text x="20" y="443.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Доступные способы, стоимость и срок</text><text x="20" y="466.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">рассчитываются после указания города и</text><text x="20" y="490.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">адреса.</text><rect x="20" y="535.5" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="587.0" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">После оформления</text><text x="20" y="624.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Магазин подтвердит наличие, согласует</text><text x="20" y="647.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">детали и сообщит об отправке или готовности</text><text x="20" y="670.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">к выдаче.</text><rect x="20" y="716.25" width="350" height="1" rx="0" fill="#E5DFD7"/><rect x="20" y="746.25" width="350" height="48" rx="4" fill="#FFFFFF" stroke="#E5DFD7"/><text x="38" y="773.29" font-size="14" fill="#23211F" font-weight="600" font-family="Inter, Arial, sans-serif">Связаться с магазином</text><rect x="0" y="866.25" width="390" height="330" rx="0" fill="#242220"/><text x="20" y="924.91" font-size="31" fill="#F7F2E9" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="20" y="967.43" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Часы, которые становятся частью вас.</text><text x="20" y="1017.29" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Каталог     Бренды     Магазины</text><text x="20" y="1056.29" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Доставка     Оплата     Сервис</text><text x="20" y="1104.43" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Южно-Сахалинск · Написать нам →</text><text x="20" y="1159.85" font-size="10" fill="#A69D92" font-weight="400" font-family="Inter, Arial, sans-serif">© BIG BEN   ·   Политика конфиденциальности</text></svg>