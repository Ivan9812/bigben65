r, Arial, sans-serif">согласие на обработку данных для выполнения</text><text x="20" y="355.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">указанного обращения или заказа.</text><rect x="20" y="400.75" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="452.25" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Отдельные разрешения</text><text x="20" y="489.65" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Согласие на рекламные сообщения оформляется</text><text x="20" y="512.9" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">отдельно от необходимых действий по заказу.</text><rect x="20" y="558.25" width="350" height="1" rx="0" fill="#E5DFD7"/><text x="20" y="609.75" font-size="25" fill="#23211F" font-weight="400" font-family="Georgia, serif">Отзыв согласия</text><text x="20" y="647.15" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">Для направления обращения об обработке</text><text x="20" y="670.4" font-size="15" fill="#77736E" font-weight="400" font-family="Inter, Arial, sans-serif">данных используйте контакты магазина.</text><rect x="20" y="715.75" width="350" height="1" rx="0" fill="#E5DFD7"/><rect x="20" y="745.75" width="350" height="48" rx="4" fill="#FFFFFF" stroke="#E5DFD7"/><text x="38" y="772.79" font-size="14" fill="#23211F" font-weight="600" font-family="Inter, Arial, sans-serif">Связаться с магазином</text><rect x="0" y="865.75" width="390" height="330" rx="0" fill="#242220"/><text x="20" y="924.41" font-size="31" fill="#F7F2E9" font-weight="400" font-family="Georgia, serif">BIG BEN</text><text x="20" y="966.93" font-size="13" fill="#C5BDB2" font-weight="400" font-family="Inter, Arial, sans-serif">Часы, которые становятся частью вас.</text><text x="20" y="1016.79" font-size="14" fill="#F7F2E9" font-weight="400" font-family="Inter, Arial, sans-serif">Каталог  