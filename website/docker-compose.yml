services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: bigben
      POSTGRES_USER: bigben
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run db:up first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - bigben-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigben -d bigben"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  bigben-postgres:
